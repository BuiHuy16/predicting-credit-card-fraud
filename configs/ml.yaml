# ML Configuration for Credit Card Fraud Detection (Kaggle S6E11)
# Primary metric: ROC-AUC, Secondary metric: PR-AUC

random_seed: 42

paths:
  train_data: "datasets/raw/train.csv"
  test_data: "datasets/raw/test.csv"
  validation_ids: "experiments/validation/validation_ids_seed42.csv"
  model_output_dir: "outputs/models"
  results_csv: "experiments/ml/results.csv"
  run_manifests_dir: "experiments/ml/run_manifests"
  validation_predictions_dir: "outputs/predictions/validation"
  test_predictions_dir: "outputs/submissions"

evaluation:
  primary_metric: "roc_auc"
  secondary_metric: "pr_auc"
  default_threshold: 0.50

# Priority P0: Mandatory baseline and nonlinear tree models
models:
  # P0: Baseline
  logistic_regression:
    priority: "P0"
    handle_imbalance: true       # class_weight='balanced'
    params:
      C: 1.0
      max_iter: 1000
      solver: "lbfgs"
      random_state: 42

  # P0: Nonlinear tree model (Random Forest)
  random_forest:
    priority: "P0"
    handle_imbalance: true       # class_weight='balanced_subsample'
    params:
      n_estimators: 100
      max_depth: 12
      min_samples_split: 10
      min_samples_leaf: 5
      n_jobs: -1
      random_state: 42

  # P0: Nonlinear boosting model (XGBoost)
  xgboost:
    priority: "P0"
    handle_imbalance: true       # scale_pos_weight calculated based on train fraud ratio (~58.9)
    early_stopping_rounds: 30
    params:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: "auc"
      random_state: 42
      n_jobs: -1

  # P1: Advanced GBDT models (LightGBM & CatBoost)
  lightgbm:
    priority: "P1"
    handle_imbalance: true       # scale_pos_weight
    early_stopping_rounds: 30
    params:
      n_estimators: 500
      learning_rate: 0.05
      num_leaves: 31
      max_depth: -1
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      verbose: -1

  catboost:
    priority: "P1"
    handle_imbalance: true       # auto_class_weights='Balanced'
    early_stopping_rounds: 30
    params:
      iterations: 500
      learning_rate: 0.05
      depth: 6
      eval_metric: "AUC"
      random_seed: 42
      verbose: 0
